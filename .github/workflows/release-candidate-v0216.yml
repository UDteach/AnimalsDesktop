name: Release candidate v0.2.16

on:
  push:
    branches:
      - "codex/animal-addition-foundation-20260723"

permissions:
  contents: read

concurrency:
  group: release-candidate-v0216-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: v0.2.16

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Generate and validate assets
        run: |
          go run ./cmd/importsheet
          go run ./cmd/importanimals
          go run ./cmd/validatemotion -runtime-only -require-accepted
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/verify_page_release.py
          git diff --exit-code -- \
            assets/source/animals/generated \
            assets/source/animals/seed-import-report.json \
            assets/sprites
      - name: Test and vet
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
      - name: Build macOS candidate ZIPs
        run: |
          VERSION="$RELEASE_VERSION" GOARCH=arm64 bash scripts/build_macos.sh
          VERSION="$RELEASE_VERSION" GOARCH=amd64 bash scripts/build_macos.sh
          unzip -l dist/AnimalsDesktop-macos-arm64.zip
          unzip -l dist/AnimalsDesktop-macos-amd64.zip
          shasum -a 256 \
            dist/AnimalsDesktop-macos-arm64.zip \
            dist/AnimalsDesktop-macos-amd64.zip \
            > dist/SHA256SUMS-macos.txt
      - name: Upload macOS candidate ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: animalsdesktop-v0216-macos-zips
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/AnimalsDesktop-macos-arm64.zip
            dist/AnimalsDesktop-macos-amd64.zip
            dist/SHA256SUMS-macos.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python validation dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements-dev.txt
      - name: Generate and validate assets
        shell: pwsh
        run: |
          go run ./cmd/importsheet
          go run ./cmd/importanimals
          go run ./cmd/validatemotion -runtime-only -require-accepted
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/verify_page_release.py
          git diff --exit-code -- `
            assets/source/animals/generated `
            assets/source/animals/seed-import-report.json `
            assets/sprites
      - name: Test and vet
        shell: pwsh
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
      - name: Build unsigned Windows candidates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = $env:RELEASE_VERSION
          $baseVersion = ($version -replace '^[vV]', '') -split '[+-]' | Select-Object -First 1
          $parts = @($baseVersion -split '\.')
          $numericVersion = (($parts + @("0", "0", "0", "0")) | Select-Object -First 4) -join "."

          go run ./cmd/winresicon -src docs/assets/animalsdesktop-preview.png -out winres/icon.png
          $winres = Get-Content winres/winres.json -Raw | ConvertFrom-Json
          $winres.RT_MANIFEST.'#1'.'0409'.identity.version = $numericVersion
          $winres.RT_VERSION.'#1'.'0000'.fixed.file_version = $numericVersion
          $winres.RT_VERSION.'#1'.'0000'.fixed.product_version = $numericVersion
          $winres.RT_VERSION.'#1'.'0000'.info.'0409'.FileVersion = $version
          $winres.RT_VERSION.'#1'.'0000'.info.'0409'.ProductVersion = $version
          $winres | ConvertTo-Json -Depth 20 | Set-Content -Path winres/winres.json -Encoding utf8
          go run github.com/tc-hib/go-winres@v0.3.1 make --arch amd64,386 --out cmd/animalsdesktop/rsrc --file-version $version --product-version $version

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -buildvcs=false -ldflags="-H=windowsgui -X main.appVersion=$version" -o dist/AnimalsDesktop-windows-amd64.exe ./cmd/animalsdesktop
          go build -buildvcs=false -tags animalsdesktop_nonetwork -ldflags="-H=windowsgui -X main.appVersion=$version" -o dist/AnimalsDesktop-windows-amd64-no-network.exe ./cmd/animalsdesktop
          $env:GOARCH = "386"
          go build -buildvcs=false -ldflags="-H=windowsgui -X main.appVersion=$version" -o dist/AnimalsDesktop-windows-386.exe ./cmd/animalsdesktop

          $signatures = Get-AuthenticodeSignature -FilePath `
            dist/AnimalsDesktop-windows-amd64.exe,`
            dist/AnimalsDesktop-windows-amd64-no-network.exe,`
            dist/AnimalsDesktop-windows-386.exe
          $signatures | Select-Object Path,Status | Format-Table -AutoSize
          $unexpected = @($signatures | Where-Object Status -ne "NotSigned")
          if ($unexpected.Count -ne 0) {
            throw "Release-candidate workflow expects unsigned Windows binaries."
          }
      - name: Package Windows candidates
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $repoUrl = "https://github.com/${{ github.repository }}"
          $candidateUrl = "$repoUrl/commit/${{ github.sha }}"

          $amd64ExeHash = (Get-FileHash -Algorithm SHA256 dist/AnimalsDesktop-windows-amd64.exe).Hash
          $amd64NoNetworkExeHash = (Get-FileHash -Algorithm SHA256 dist/AnimalsDesktop-windows-amd64-no-network.exe).Hash
          $x86ExeHash = (Get-FileHash -Algorithm SHA256 dist/AnimalsDesktop-windows-386.exe).Hash

          function Write-SecurityFile {
            param(
              [string]$Path,
              [string]$Arch,
              [string]$ZipName,
              [string]$ExeHash,
              [switch]$NoNetwork
            )
            $networkNote = if ($NoNetwork) {
              "- Automatic and tray update checks, downloads, and installation are disabled."
            } else {
              "- Update checks and downloads use GitHub release metadata."
            }
            @"
          Animals Desktop Windows release-candidate security notes

          Version: $version
          Architecture: $Arch
          Package file: $ZipName
          Executable: AnimalsDesktop.exe
          Executable SHA256: $ExeHash
          Candidate commit: $candidateUrl
          Source repository: $repoUrl
          Authenticode status: NotSigned

          Expected behavior:
          - Windows taskbar desktop pet app.
          - Runs as the current user; no admin manifest/elevation request.
          $networkNote
          - Smart App Control, SmartScreen, or security software may warn about or block this unsigned executable.
          - SHA256 verifies file integrity but does not replace a trusted code signature.
          "@ | Set-Content -Path $Path -Encoding ascii
          }

          New-Item -ItemType Directory -Force `
            dist/package-amd64,`
            dist/package-amd64-no-network,`
            dist/package-386 | Out-Null

          Copy-Item dist/AnimalsDesktop-windows-amd64.exe dist/package-amd64/AnimalsDesktop.exe
          Copy-Item README.md dist/package-amd64/README.md
          Write-SecurityFile -Path dist/package-amd64/SECURITY.txt -Arch "windows-amd64" -ZipName "AnimalsDesktop-windows-amd64.zip" -ExeHash $amd64ExeHash

          Copy-Item dist/AnimalsDesktop-windows-amd64-no-network.exe dist/package-amd64-no-network/AnimalsDesktop.exe
          Copy-Item README.md dist/package-amd64-no-network/README.md
          Write-SecurityFile -Path dist/package-amd64-no-network/SECURITY.txt -Arch "windows-amd64-no-network" -ZipName "AnimalsDesktop-windows-amd64-no-network.zip" -ExeHash $amd64NoNetworkExeHash -NoNetwork

          Copy-Item dist/AnimalsDesktop-windows-386.exe dist/package-386/AnimalsDesktop.exe
          Copy-Item README.md dist/package-386/README.md
          Write-SecurityFile -Path dist/package-386/SECURITY.txt -Arch "windows-386" -ZipName "AnimalsDesktop-windows-386.zip" -ExeHash $x86ExeHash

          Compress-Archive -Path dist/package-amd64/* -DestinationPath dist/AnimalsDesktop-windows-amd64.zip -Force
          Compress-Archive -Path dist/package-amd64-no-network/* -DestinationPath dist/AnimalsDesktop-windows-amd64-no-network.zip -Force
          Compress-Archive -Path dist/package-386/* -DestinationPath dist/AnimalsDesktop-windows-386.zip -Force

          $sumLines = Get-FileHash -Algorithm SHA256 `
            dist/AnimalsDesktop-windows-amd64.zip,`
            dist/AnimalsDesktop-windows-amd64-no-network.zip,`
            dist/AnimalsDesktop-windows-386.zip |
            ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }
          $sumLines += "$amd64ExeHash  AnimalsDesktop-windows-amd64.zip/AnimalsDesktop.exe"
          $sumLines += "$amd64NoNetworkExeHash  AnimalsDesktop-windows-amd64-no-network.zip/AnimalsDesktop.exe"
          $sumLines += "$x86ExeHash  AnimalsDesktop-windows-386.zip/AnimalsDesktop.exe"
          $sumLines | Set-Content -Path dist/SHA256SUMS-windows.txt -Encoding ascii

          Get-ChildItem dist/AnimalsDesktop-windows-*.zip | Select-Object Name,Length
          Get-Content dist/SHA256SUMS-windows.txt
      - name: Upload Windows candidate ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: animalsdesktop-v0216-windows-zips
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/AnimalsDesktop-windows-amd64.zip
            dist/AnimalsDesktop-windows-amd64-no-network.zip
            dist/AnimalsDesktop-windows-386.zip
            dist/SHA256SUMS-windows.txt
